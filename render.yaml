services:
  - type: web
    name: cinescope-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://cinescopecodespactor.netlify.app
      - key: PUBLIC_SITE_URL
        value: https://cinescopecodespactor.netlify.app
      - key: ADMIN_ORIGIN
        sync: false

